# Same stack as docker-compose.yml. `docker compose up` starts it.
version: '3'
services:
  server: &server
    build:
      context: ./
      args:
        - DOCKER_TAG=QA
    restart: always
    depends_on:
      - db
#   volumes:
#       e.g. to mount LDAP config:
#       - /c/Users/username/dockerdata/guacozy/ldap_config.py:/app/guacozy_server/ldap_config.py
#       - /home/username/dockerdata/guacozy/ldap_config.py:/app/guacozy_server/ldap_config.py
    environment:
      - DJANGO_SECRET_KEY=youshoulddefinetelychangethistosomethingelseandtakecare
      - FIELD_ENCRYPTION_KEY=qjq4ObsXMqiqQyfKgD-jjEGm4ep8RaHKGRg4ohGCi1A=
      - DJANGO_TIME_ZONE=Europe/Vilnius
      - DJANGO_DB_URL=postgres://postgres@db:5432/postgres
      - DJANGO_ALLOWED_HOSTS=*
    ports:
      - 10080:80
      - 10443:443
  guacd:
    image: guacamole/guacd
    restart: always
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      # The app's DJANGO_DB_URL has no password. Trust keeps that URL working.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
    # PG 18 stores the cluster in /var/lib/postgresql/18/docker.
    # postgres-data is the pre-18 cluster (PG_VERSION at the volume root).
    # Mounting that volume here makes Postgres 18 exit 1.
    - postgres18-data:/var/lib/postgresql
volumes:
  postgres18-data:

