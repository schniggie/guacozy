# Development stack: docker compose -f docker-compose.dev.yml up
version: '3'
services:
  django:
    build:
      context: ./guacozy_server/
    restart: always
    depends_on:
      - db
    volumes:
      - ./guacozy_server:/app
    env_file:
      - .env
    environment:
      DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY in .env}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Europe/Vilnius}
      DJANGO_DB_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/postgres
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - 8000:8000
  react:
    build:
      context: ./frontend/
    volumes:
      - ./frontend:/frontend
      - ./guacozy_server/static/css/styles.css:/guacozy_server/static/css/styles.css:ro
    ports:
      - 3000:3000
    environment:
      - DJANGO_PROXY_HOST=django
      - DJANGO_PROXY_PORT=8000
  guacd:
    image: guacamole/guacd:1.6.0
    restart: always
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      # Applied only when this volume is first created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
    # PG 18 stores the cluster in /var/lib/postgresql/18/docker.
    # dev-postgres-data is the pre-18 cluster (PG_VERSION at the volume root).
    # Mounting that volume here makes Postgres 18 exit 1.
    - dev-postgres18-data:/var/lib/postgresql

volumes:
  dev-postgres18-data:
