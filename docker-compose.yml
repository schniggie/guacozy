# docker compose up --build
# Requires a repo-root .env. See .env.example.
# https://localhost:10443/cozy/
# Same stack as docker-compose-qa.yml, including the postgres18-data volume.
version: '3'
services:
  server: &server
    build:
      context: ./
      args:
        - DOCKER_TAG=QA
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY in .env}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Europe/Vilnius}
      DJANGO_DB_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/postgres
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - 10443:443
    volumes:
      - guacozy-ssl:/ssl
  guacd:
    image: guacamole/guacd:1.6.0
    restart: always
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      # Applied only when this volume is first created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
    # PG 18 stores the cluster in /var/lib/postgresql/18/docker.
    # postgres-data is the pre-18 cluster (PG_VERSION at the volume root).
    # Mounting that volume here makes Postgres 18 exit 1.
    - postgres18-data:/var/lib/postgresql
volumes:
  postgres18-data:
  guacozy-ssl:
